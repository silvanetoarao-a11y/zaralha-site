<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel Admin - Loja</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .admin-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .admin-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .admin-tab { padding: 12px 24px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .admin-tab.active { background: var(--neon-1); border-color: var(--neon-1); }
    .admin-tab:hover { background: rgba(124,58,237,.2); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    .admin-table th { background: var(--card); font-weight: 700; }
    .admin-form { display: grid; gap: 16px; max-width: 600px; }
    .admin-form input, .admin-form select, .admin-form textarea { 
      padding: 12px; border-radius: 8px; border: 1px solid var(--border); 
      background: rgba(0,0,0,.2); color: var(--text); width: 100%;
    }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-value { font-size: 32px; font-weight: 900; color: var(--neon-2); margin: 10px 0; }
  </style>
  <script>
    window.API_URL = 'http://localhost:3000/api';
  </script>
</head>
<body>
  <div class="backdrop"></div>
  
  <header>
    <div class="container nav">
      <a class="brand" href="../index.html">
        <div class="logo"></div>
        <div class="name">Admin Panel</div>
      </a>
      <nav class="menu">
        <a href="../index.html">Voltar ao Site</a>
        <button class="btn btn-ghost" onclick="logout()">Sair</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="admin-container">
      <div class="admin-header">
        <h1 class="section-title">Painel Administrativo</h1>
        <p class="muted">Gerencie produtos, preços e visualize estatísticas</p>
      </div>

      <!-- Abas -->
      <div class="admin-tabs">
        <div class="admin-tab active" onclick="switchTab('stats')">Estatísticas</div>
        <div class="admin-tab" onclick="switchTab('products')">Produtos</div>
        <div class="admin-tab" onclick="switchTab('purchases')">Compras</div>
      </div>

      <!-- Estatísticas -->
      <div id="statsTab" class="tab-content active">
        <div class="stats-grid" id="statsGrid">
          <!-- Carregado via JS -->
        </div>
      </div>

      <!-- Produtos -->
      <div id="productsTab" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>Produtos</h2>
          <button class="btn btn-primary" onclick="showProductForm()">+ Novo Produto</button>
        </div>
        
        <select id="productGameFilter" onchange="loadProducts()" style="margin-bottom: 20px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text);">
          <option value="">Todos os jogos</option>
          <option value="rust">Rust</option>
          <option value="minecraft">Minecraft</option>
          <option value="dayz">DayZ</option>
        </select>

        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Jogo</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Item ID</th>
              <th>Quantidade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="productsTable">
            <!-- Carregado via JS -->
          </tbody>
        </table>
      </div>

      <!-- Compras -->
      <div id="purchasesTab" class="tab-content">
        <h2>Compras</h2>
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuário</th>
              <th>Produto</th>
              <th>Steam ID</th>
              <th>Preço</th>
              <th>Status</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="purchasesTable">
            <!-- Carregado via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal de Produto -->
  <div id="productModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width: 600px;">
      <span class="close" onclick="closeProductModal()">&times;</span>
      <h2 id="productModalTitle">Novo Produto</h2>
      <form class="admin-form" id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">
        <input type="text" id="productName" placeholder="Nome do produto" required>
        <textarea id="productDescription" placeholder="Descrição" rows="3"></textarea>
        <select id="productGame" required>
          <option value="">Selecione o jogo</option>
          <option value="rust">Rust</option>
          <option value="minecraft">Minecraft</option>
          <option value="dayz">DayZ</option>
        </select>
        <select id="productCategory">
          <option value="items">Itens</option>
          <option value="weapons">Armas</option>
          <option value="kits">Kits</option>
          <option value="vip">VIP</option>
        </select>
        <input type="number" id="productPrice" placeholder="Preço" step="0.01" min="0" required>
        <input type="text" id="productItemId" placeholder="Item ID (ex: rifle.ak)" required>
        <input type="number" id="productQuantity" placeholder="Quantidade" value="1" min="1" required>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
          <button type="button" class="btn btn-ghost" onclick="closeProductModal()" style="flex: 1;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
